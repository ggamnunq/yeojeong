version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # 막 배포된 버전은 며칠 기다렸다가 올린다 (공급망 공격 대비)
    cooldown:
      default-days: 3
    groups:
      npm-minor-patch:
        patterns: ['*']
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      github-actions:
        patterns: ['*']

  - package-ecosystem: docker
    directory: /apps/api
    schedule:
      interval: weekly
    cooldown:
      default-days: 3

  - package-ecosystem: terraform
    directories:
      - /infra/bootstrap
      - /infra/envs/prod
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      terraform:
        patterns: ['*']

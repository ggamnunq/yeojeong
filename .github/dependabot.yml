version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # 막 배포된 버전은 며칠 기다렸다가 올린다 (공급망 공격 대비)
    cooldown:
      default-days: 3
    groups:
      # vitest와 @vitest/* 는 버전이 맞아야 해서 메이저도 한 PR로 묶는다
      vitest:
        patterns: ['vitest', '@vitest/*']
      npm-minor-patch:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      # Nest CLI가 쓰는 TypeScript 컴파일러 API가 7.0에 없다(7.1에서 복귀 예정). 그때 해제한다.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      github-actions:
        patterns: ['*']

  - package-ecosystem: docker
    directory: /apps/api
    schedule:
      interval: weekly
    cooldown:
      default-days: 3

  - package-ecosystem: terraform
    directories:
      - /infra/bootstrap
      - /infra/envs/prod
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      terraform:
        patterns: ['*']

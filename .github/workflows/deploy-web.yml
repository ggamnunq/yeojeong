name: Deploy Web

on:
  push:
    branches: [main]
    paths:
      - apps/web/**
      - packages/shared/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/deploy-web.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # CLOUDFLARE_API_TOKEN은 main 브랜치만 쓸 수 있는 production 환경의 secret이다
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @yeojeong/web... build
        env:
          # CODEF 공개키(DER) SHA-256(비밀 아님, 저장소 변수). 비어 있으면 운영 빌드에서 카드 내역 불러오기 진입을 막는다
          VITE_CODEF_PUBKEY_SHA256: ${{ vars.CODEF_PUBKEY_SHA256 }}
      # Worker 스크립트와 정적 자산만 올린다. 도메인 연결과 secret은 Terraform/README 절차로 관리한다.
      - name: Deploy to Cloudflare Workers
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm exec wrangler deploy

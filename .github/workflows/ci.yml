name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: yeojeong
          POSTGRES_PASSWORD: yeojeong
          POSTGRES_DB: yeojeong_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yeojeong -d yeojeong_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://yeojeong:yeojeong@localhost:5432/yeojeong_test
      TEST_DATABASE_URL: postgresql://yeojeong:yeojeong@localhost:5432/yeojeong_s2a_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: PGPASSWORD=yeojeong createdb -h localhost -U yeojeong yeojeong_s2a_test
      - run: pnpm --filter @yeojeong/api db:migrate:deploy
      - run: DATABASE_URL="$TEST_DATABASE_URL" pnpm --filter @yeojeong/api db:migrate:deploy
      # api의 type-aware 린트가 shared 빌드 결과를 참조하므로 빌드를 먼저 한다
      - run: pnpm build
      - run: pnpm --filter @yeojeong/web ds:tokens:check
      - run: pnpm lint
      - run: pnpm test
